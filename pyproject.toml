[project]
name = "qq-data-exporter"
version = "0.1.0"
description = "Decoupled QQ group/private chat exporter built on NapCatQQ"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "orjson>=3.10.15",
    "prompt-toolkit>=3.0.52",
    "pydantic>=2.11.1",
    "pypinyin>=0.55.0",
    "qrcode>=8.2",
    "rich>=13.9.4",
    "typer>=0.16.1",
    "websockets>=15.0.1",
]

[project.optional-dependencies]
process = [
    "numpy>=2.4.2",
    "qdrant-client>=1.17.0",
]
image = [
    "pillow>=12.1.1",
]
embeddings = [
    "bitsandbytes>=0.49.2",
    "huggingface-hub<1.0",
    "pillow>=12.1.1",
    "qwen-vl-utils>=0.0.14",
    "torch",
    "transformers>=4.52.0,<5.0.0",
]
dev = [
    "pytest>=8.3.5",
]

[project.scripts]
qq-data-cli = "qq_data_cli.app:main"

[tool.uv]
cache-dir = ".uv-cache"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["src"]
